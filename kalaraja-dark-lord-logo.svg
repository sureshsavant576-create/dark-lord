<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="100%" height="100%">
  <defs>
    <!-- Dark Void & Neon Gradients -->
    <radialGradient id="voidCore" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#18102b" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#0d0818" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#05030a" stop-opacity="1" />
    </radialGradient>

    <linearGradient id="neonVioletCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="45%" stop-color="#8b5cf6" />
      <stop offset="85%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="bladeGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#e0e7ff" />
      <stop offset="60%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>

    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- High-Impact Anime Glow Filters -->
    <filter id="animeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .spin-slow {
        transform-origin: 400px 280px;
        animation: kalarajaSpin 32s linear infinite;
      }
      .spin-counter {
        transform-origin: 400px 280px;
        animation: kalarajaSpinRev 22s linear infinite;
      }
      .pulse-energy {
        transform-origin: 400px 280px;
        animation: kalarajaPulse 4s ease-in-out infinite;
      }
      .blade-pulse {
        animation: kalarajaBladeGlow 3s ease-in-out infinite alternate;
      }
      .eye-glow {
        transform-origin: 400px 280px;
        animation: kalarajaEyePulse 2.5s ease-in-out infinite;
      }
      .particle-float-1 {
        animation: kalarajaParticle 4s ease-in-out infinite;
      }
      .particle-float-2 {
        animation: kalarajaParticle 3.2s ease-in-out infinite 1s;
      }
      .particle-float-3 {
        animation: kalarajaParticle 4.5s ease-in-out infinite 2s;
      }

      @keyframes kalarajaSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes kalarajaSpinRev {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes kalarajaPulse {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.04); opacity: 1; }
      }
      @keyframes kalarajaBladeGlow {
        0% { filter: drop-shadow(0 0 4px #8b5cf6) drop-shadow(0 0 10px #6366f1); }
        100% { filter: drop-shadow(0 0 10px #38bdf8) drop-shadow(0 0 24px #a855f7); }
      }
      @keyframes kalarajaEyePulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px #38bdf8); }
        50% { transform: scale(1.22); filter: drop-shadow(0 0 16px #ec4899); }
      }
      @keyframes kalarajaParticle {
        0% { transform: translateY(0px) scale(0.8); opacity: 0.2; }
        50% { opacity: 0.9; }
        100% { transform: translateY(-40px) scale(1.2); opacity: 0; }
      }
    </style>
  </defs>

  <!-- Ambient Cosmic Aura Background -->
  <rect width="800" height="700" rx="24" fill="url(#voidCore)" />
  
  <!-- Outer Energy Ripple Rings -->
  <g class="pulse-energy" opacity="0.6">
    <circle cx="400" cy="280" r="230" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3 9" opacity="0.4" />
    <circle cx="400" cy="280" r="215" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="16 8 4 8" opacity="0.5" />
    <circle cx="400" cy="280" r="195" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.3" />
  </g>

  <!-- Floating Anime Mana Embers -->
  <g fill="#38bdf8" filter="url(#coreGlow)">
    <circle class="particle-float-1" cx="330" cy="360" r="2.5" />
    <circle class="particle-float-2" cx="470" cy="340" r="2" />
    <circle class="particle-float-3" cx="390" cy="380" r="3" />
    <circle class="particle-float-1" cx="290" cy="260" r="2" fill="#ec4899" />
    <circle class="particle-float-2" cx="510" cy="270" r="2.5" fill="#c084fc" />
  </g>

  <!-- ROTATING LAYER 1: OUTER SANSKRIT MANDALA RING -->
  <g class="spin-slow">
    <circle cx="400" cy="280" r="175" fill="none" stroke="url(#neonVioletCyan)" stroke-width="2.5" opacity="0.8" />
    <circle cx="400" cy="280" r="162" fill="none" stroke="#a855f7" stroke-width="1" stroke-dasharray="8 6" opacity="0.5" />
    
    <!-- 8 Cardinal Runic Spikes & Notches -->
    <path d="M 400 95 L 405 105 L 395 105 Z" fill="#38bdf8" filter="url(#coreGlow)" />
    <path d="M 400 465 L 405 455 L 395 455 Z" fill="#38bdf8" filter="url(#coreGlow)" />
    <path d="M 215 280 L 225 275 L 225 285 Z" fill="#38bdf8" filter="url(#coreGlow)" />
    <path d="M 585 280 L 575 275 L 575 285 Z" fill="#38bdf8" filter="url(#coreGlow)" />

    <!-- Diagonal Cardinal Glyphs -->
    <circle cx="270" cy="150" r="3" fill="#ec4899" />
    <circle cx="530" cy="150" r="3" fill="#ec4899" />
    <circle cx="270" cy="410" r="3" fill="#ec4899" />
    <circle cx="530" cy="410" r="3" fill="#ec4899" />
  </g>

  <!-- ROTATING LAYER 2: INNER OCTAGONAL RUNIC BARRIER (Counter-Rotating) -->
  <g class="spin-counter">
    <polygon points="400,140 499,181 540,280 499,379 400,420 301,379 260,280 301,181" 
             fill="none" stroke="url(#neonVioletCyan)" stroke-width="1.8" opacity="0.65" stroke-dasharray="24 8" />
    
    <polygon points="400,150 404,155 400,160 396,155" fill="#38bdf8" />
    <polygon points="490,188 494,193 490,198 486,193" fill="#38bdf8" />
    <polygon points="530,280 534,285 530,290 526,285" fill="#38bdf8" />
    <polygon points="490,372 494,377 490,382 486,377" fill="#38bdf8" />
    <polygon points="400,410 404,415 400,420 396,415" fill="#38bdf8" />
    <polygon points="310,372 314,377 310,382 306,377" fill="#38bdf8" />
    <polygon points="270,280 274,285 270,290 266,285" fill="#38bdf8" />
    <polygon points="310,188 314,193 310,198 306,193" fill="#38bdf8" />
  </g>

  <!-- CORE ANIME CREST: TRISHULA OF THE DARK LORD -->
  <g class="blade-pulse" id="kalaraja-crest">
    <!-- Back Astral Wings / Dark Horns -->
    <path d="M 400 240 C 450 180, 520 160, 545 110 C 530 165, 490 230, 445 275 C 475 285, 520 295, 560 270 C 515 320, 455 325, 420 305 Z" 
          fill="url(#neonVioletCyan)" opacity="0.75" filter="url(#animeGlow)" />
    
    <path d="M 400 240 C 350 180, 280 160, 255 110 C 270 165, 310 230, 355 275 C 325 285, 280 295, 240 270 C 285 320, 345 325, 380 305 Z" 
          fill="url(#neonVioletCyan)" opacity="0.75" filter="url(#animeGlow)" />

    <!-- Left Scythe Blade -->
    <path d="M 360 270 C 330 220, 290 170, 295 115 C 310 160, 345 200, 375 230 L 370 295 Z" 
          fill="url(#bladeGrad)" stroke="#c084fc" stroke-width="1.5" />

    <!-- Right Scythe Blade -->
    <path d="M 440 270 C 470 220, 510 170, 505 115 C 490 160, 455 200, 425 230 L 430 295 Z" 
          fill="url(#bladeGrad)" stroke="#c084fc" stroke-width="1.5" />

    <!-- Central Trishula Sovereign Blade -->
    <path d="M 400 48 L 418 170 L 412 280 L 400 310 L 388 280 L 382 170 Z" 
          fill="url(#bladeGrad)" stroke="#ffffff" stroke-width="2" filter="url(#animeGlow)" />
    <path d="M 400 70 L 407 175 L 404 270 L 400 285 L 396 270 L 393 175 Z" 
          fill="url(#neonVioletCyan)" />

    <!-- Crossguard -->
    <polygon points="400,285 435,305 445,325 400,340 355,325 365,305" 
             fill="#1e103a" stroke="#8b5cf6" stroke-width="2" />
    <polygon points="400,295 425,310 400,325 375,310" 
             fill="url(#flameGrad)" />

    <!-- Lower Blade Pommel -->
    <path d="M 400 340 L 412 390 L 400 445 L 388 390 Z" 
          fill="url(#bladeGrad)" stroke="#8b5cf6" stroke-width="1.5" />
  </g>

  <!-- THE AWAKENED KĀLA-NETRA (THIRD EYE) -->
  <g class="eye-glow">
    <polygon points="400,250 428,280 400,310 372,280" 
             fill="#080314" stroke="#38bdf8" stroke-width="2.5" filter="url(#coreGlow)" />
    <polygon points="400,258 420,280 400,302 380,280" 
             fill="url(#flameGrad)" />
    <ellipse cx="400" cy="280" rx="3.5" ry="14" fill="#ffffff" filter="url(#coreGlow)" />
    <circle cx="400" cy="280" r="3" fill="#ffffff" />
  </g>

  <!-- SANSKRIT IN ENGLISH CHARACTERS -->
  <text x="400" y="492" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="10" fill="#8b5cf6" opacity="0.75" font-weight="600">
    कालराज • KĀLARĀJA
  </text>

  <!-- PRIMARY WORDMARK -->
  <text x="400" y="552" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="46" font-weight="900" letter-spacing="16" fill="url(#neonVioletCyan)" stroke="#ffffff" stroke-width="0.75">
    KĀLARĀJA
  </text>

  <line x1="220" y1="575" x2="370" y2="575" stroke="url(#neonVioletCyan)" stroke-width="2" />
  <line x1="430" y1="575" x2="580" y2="575" stroke="url(#neonVioletCyan)" stroke-width="2" />
  <polygon points="400,571 405,575 400,579 395,575" fill="#38bdf8" filter="url(#coreGlow)" />

  <text x="400" y="608" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" letter-spacing="10" fill="#f8fafc">
    THE DARK LORD
  </text>

  <text x="400" y="638" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="500" letter-spacing="4" fill="#94a3b8">
    TAMASO MĀ JYOTIR GAMAYA • ANANTA TAMAS • SHAKTI
  </text>
</svg>