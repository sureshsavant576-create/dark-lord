<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="100%" height="100%" fill="none" class="sanket-brand-horizontal">
  <defs>
    <radialGradient id="h-bg-glow" cx="40" cy="40" r="38">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0E1526" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="h-spectrum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#6366F1"/>
      <stop offset="85%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="h-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <linearGradient id="h-ai-pill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <filter id="h-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left Symbol Group (Scaled to 64x64 centered at x=40, y=40) -->
  <g transform="translate(8, 8) scale(0.533)">
    <circle cx="60" cy="60" r="54" fill="url(#h-bg-glow)" />
    <polygon points="60,6 106,32 106,88 60,114 14,88 14,32" 
             stroke="url(#h-spectrum)" stroke-width="3" stroke-linejoin="round" fill="#090D17" fill-opacity="0.9"/>
    <!-- Optical calibration ticks -->
    <line x1="60" y1="2" x2="60" y2="8" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="60" y1="112" x2="60" y2="118" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Aperture facets -->
    <path d="M60 26 L86 52 L60 60 Z" fill="#38BDF8" fill-opacity="0.85" />
    <path d="M86 52 L86 78 L60 60 Z" fill="#6366F1" fill-opacity="0.9" />
    <path d="M86 78 L60 94 L60 60 Z" fill="#8B5CF6" fill-opacity="0.85" />
    <path d="M60 94 L34 78 L60 60 Z" fill="#10B981" fill-opacity="0.9" />
    <path d="M34 78 L34 52 L60 60 Z" fill="#06B6D4" fill-opacity="0.85" />
    <path d="M34 52 L60 26 L60 60 Z" fill="#818CF8" fill-opacity="0.9" />
    <!-- Focal Core -->
    <circle cx="60" cy="60" r="14" fill="#060913" stroke="url(#h-spectrum)" stroke-width="2" />
    <circle cx="60" cy="60" r="6" fill="#FFFFFF" filter="url(#h-glow)" />
    <circle cx="60" cy="38" r="3" fill="#38BDF8" filter="url(#h-glow)"/>
  </g>

  <!-- Typography: SANKET -->
  <text x="88" y="47" 
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="34" 
        font-weight="800" 
        letter-spacing="-0.035em" 
        fill="url(#h-text-grad)">SANKET</text>

  <!-- AI Gradient Badge Pill -->
  <g transform="translate(242, 22)">
    <rect x="0" y="0" width="46" height="26" rx="6" fill="url(#h-ai-pill)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="23" y="18" 
          font-family="'JetBrains Mono', monospace" 
          font-size="14" 
          font-weight="800" 
          letter-spacing="0.05em" 
          fill="#FFFFFF" 
          text-anchor="middle">AI</text>
  </g>

  <!-- Devanagari Inscription: संकेत -->
  <text x="89" y="66" 
        font-family="'Plus Jakarta Sans', 'Inter', sans-serif" 
        font-size="12" 
        font-weight="600" 
        letter-spacing="0.18em" 
        fill="#94A3B8">संकेत &bull; MULTIMODAL BRAND GOVERNANCE</text>

  <!-- Small Version Tag -->
  <text x="375" y="66" 
        font-family="'JetBrains Mono', monospace" 
        font-size="10" 
        font-weight="600" 
        fill="#6366F1" 
        letter-spacing="0.08em">v3.0</text>
</svg>
