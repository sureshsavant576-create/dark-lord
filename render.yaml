services:
  # ---------------------------------------------------------------------------
  # Backend API Service (Python + FastAPI + Gemini API + Groq API + Supabase)
  # ---------------------------------------------------------------------------
  - type: web
    name: sanket-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/system/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_RLS_ENABLED
        value: "true"
      - key: MAX_COLOR_DELTA_E
        value: "15.0"
      - key: MIN_OVERALL_PASS_SCORE
        value: "70.0"

  # ---------------------------------------------------------------------------
  # Frontend Application (Next.js + React Dashboard)
  # ---------------------------------------------------------------------------
  - type: web
    name: sanket-ai-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 20.10.0
      - key: NEXT_PUBLIC_API_URL
        value: /api/v1
      - key: BACKEND_INTERNAL_URL
        fromService:
          type: web
          name: sanket-ai-backend
          property: host
