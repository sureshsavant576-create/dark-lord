<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none" class="sanket-brand-symbol">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="symbol-bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0E1526" stop-opacity="0"/>
    </radialGradient>

    <!-- Spectrum Laser Gradient -->
    <linearGradient id="spectrum-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#6366F1"/>
      <stop offset="85%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Shield Outline Gradient -->
    <linearGradient id="shield-stroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Inner Core Glow -->
    <linearGradient id="core-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <filter id="laser-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Shield -->
  <circle cx="60" cy="60" r="54" fill="url(#symbol-bg-glow)" />

  <!-- Outer Precision Hex Shield -->
  <polygon points="60,6 106,32 106,88 60,114 14,88 14,32" 
           stroke="url(#shield-stroke)" stroke-width="2.5" stroke-linejoin="round" fill="#090D17" fill-opacity="0.85"/>

  <!-- Optical Calibration Tick Marks -->
  <line x1="60" y1="1" x2="60" y2="8" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="112" x2="60" y2="119" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
  <line x1="9" y1="60" x2="16" y2="60" stroke="#818CF8" stroke-width="2" stroke-linecap="round"/>
  <line x1="104" y1="60" x2="111" y2="60" stroke="#A855F7" stroke-width="2" stroke-linecap="round"/>

  <!-- Nested Rotated Dynamic Diamond Aperture -->
  <polygon points="60,22 94,60 60,98 26,60" 
           stroke="url(#spectrum-grad)" stroke-width="2" stroke-linejoin="round" fill="none" opacity="0.6" stroke-dasharray="2 3"/>

  <!-- Optical Signal Aperture Facets (Representing Multimodal & CIELAB chromatic rays) -->
  <path d="M60 26 L86 52 L60 60 Z" fill="#38BDF8" fill-opacity="0.8" />
  <path d="M86 52 L86 78 L60 60 Z" fill="#6366F1" fill-opacity="0.85" />
  <path d="M86 78 L60 94 L60 60 Z" fill="#8B5CF6" fill-opacity="0.8" />
  <path d="M60 94 L34 78 L60 60 Z" fill="#10B981" fill-opacity="0.85" />
  <path d="M34 78 L34 52 L60 60 Z" fill="#06B6D4" fill-opacity="0.8" />
  <path d="M34 52 L60 26 L60 60 Z" fill="#818CF8" fill-opacity="0.9" />

  <!-- Inner Dynamic Focal Core (The 'Sanket' Signal Iris) -->
  <circle cx="60" cy="60" r="14" fill="#060913" stroke="url(#spectrum-grad)" stroke-width="2" />
  <circle cx="60" cy="60" r="7" fill="url(#core-glow)" filter="url(#laser-blur)" />
  <circle cx="60" cy="60" r="2.5" fill="#FFFFFF" />

  <!-- Subtle Devanagari 'सं' Chromatic Anusvara Dot Indicator -->
  <circle cx="60" cy="38" r="3" fill="#38BDF8" filter="url(#laser-blur)"/>
</svg>
