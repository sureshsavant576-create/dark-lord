<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="favVoid" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e103a" />
      <stop offset="60%" stop-color="#0e071c" />
      <stop offset="100%" stop-color="#05020a" />
    </radialGradient>
    <linearGradient id="favNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="favBlade" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <filter id="favGlow">
      <feGaussianBlur stdDeviation="1.5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#favVoid)" stroke="#8b5cf6" stroke-width="2" />

  <circle cx="64" cy="64" r="50" fill="none" stroke="url(#favNeon)" stroke-width="1.8" stroke-dasharray="8 4" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" from="0 64 64" to="360 64 64" dur="20s" repeatCount="indefinite" />
  </circle>

  <polygon points="64,22 94,34 106,64 94,94 64,106 34,94 22,64 34,34" 
           fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" from="360 64 64" to="0 64 64" dur="15s" repeatCount="indefinite" />
  </polygon>

  <path d="M 64 62 C 54 48 42 42 36 28 C 40 44 48 54 56 62 Z" fill="url(#favBlade)" opacity="0.85" filter="url(#favGlow)" />
  <path d="M 64 62 C 74 48 86 42 92 28 C 88 44 80 54 72 62 Z" fill="url(#favBlade)" opacity="0.85" filter="url(#favGlow)" />

  <path d="M 64 14 L 69 46 L 67 72 L 64 78 L 61 72 L 59 46 Z" fill="url(#favBlade)" stroke="#ffffff" stroke-width="0.8" filter="url(#favGlow)" />
  <path d="M 64 22 L 66 48 L 64 66 L 62 48 Z" fill="#38bdf8" />

  <path d="M 64 82 L 68 96 L 64 110 L 60 96 Z" fill="url(#favBlade)" stroke="#8b5cf6" stroke-width="0.6" />

  <polygon points="64,54 74,64 64,74 54,64" fill="#080314" stroke="#38bdf8" stroke-width="1.2">
    <animate attributeName="stroke" values="#38bdf8;#ec4899;#38bdf8" dur="3s" repeatCount="indefinite" />
  </polygon>
  <circle cx="64" cy="64" r="3" fill="#ffffff">
    <animate attributeName="r" values="2;3.8;2" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>